# Continuous integration for the Aria Django project.
# What each job does and how to run the same checks locally: docs/ci-cd.md
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# a newer push to the same branch/PR cancels the older, still-running build
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev tools
        run: pip install -r requirements-dev.txt
      - name: ruff check
        # ruff.toml at the repo root holds the ruleset; github format annotates the PR diff
        run: ruff check . --output-format=github

  test:
    name: Tests (Django + Postgres 18)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: aria_ci
          POSTGRES_USER: aria
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aria -d aria_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # throwaway CI database; not a secret. The test runner creates test_aria_ci itself.
      DB_NAME: aria_ci
      DB_USER: aria
      DB_PASSWORD: ci-only-password
      DB_HOST: localhost
      DB_PORT: "5432"
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
    defaults:
      run:
        working-directory: aria_project
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        # requirements.txt is UTF-16 with a BOM; pip detects the BOM and decodes it, no conversion needed
        working-directory: .
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Django system checks
        run: python manage.py check
      - name: Migrations are up to date with the models
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests with coverage
        run: >-
          coverage run --branch --source=.
          --omit="*/migrations/*,*/tests/*,*/tests.py,manage.py"
          manage.py test --noinput
      - name: Coverage report
        if: always()
        run: |
          coverage report --skip-covered --sort=cover
          coverage html -d coverage-html
          coverage xml -o coverage.xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: |
            aria_project/coverage-html/
            aria_project/coverage.xml
          retention-days: 14
          if-no-files-found: ignore

  security:
    name: Security (pip-audit, bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev tools
        run: pip install -r requirements-dev.txt
      - name: pip-audit (known CVEs in runtime dependencies)
        # blocking: a known vulnerability in a pinned runtime package means bump the pin
        run: pip-audit -r requirements.txt --strict
      - name: bandit (all findings, report only)
        # shows every finding, including low-severity ones, without failing the build
        run: bandit -r aria_project -x "*/tests/*,*/migrations/*,*/tests.py" --exit-zero
      - name: bandit (medium+ severity and confidence, blocking)
        run: bandit -r aria_project -x "*/tests/*,*/migrations/*,*/tests.py" -ll -ii -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: aria:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

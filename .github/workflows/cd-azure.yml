# Continuous deployment to Azure: STUB, NOT ACTIVE.
#
# This workflow only runs when started by hand (Actions tab -> "CD (Azure, inactive stub)"
# -> Run workflow). It never runs on push or PR. It will fail at the first step until the
# Azure resources exist and the secrets/variables below are configured in the repo's
# "production" environment. Nothing in it points at a real Azure resource yet.
#
# Before turning it on, see docs/ci-cd.md "CD (Azure)": the image still runs
# `manage.py runserver` and needs a production server, and migrations need a release step.
#
# Required secrets (OIDC federated credential, no client secret stored in GitHub):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Required variables (placeholders; names to be decided when the resources are created):
#   AZURE_ACR_NAME       e.g. <your-registry-name>  (Azure Container Registry, without .azurecr.io)
#   AZURE_WEBAPP_NAME    e.g. <your-webapp-name>    (App Service, Web App for Containers)
name: CD (Azure, inactive stub)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (must already have passed CI)
        required: true
        default: master

permissions:
  contents: read

concurrency:
  group: cd-azure
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC login to Azure
    env:
      IMAGE_NAME: aria
    steps:
      - name: Refuse to run until Azure is configured
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          missing=""
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_ACR_NAME AZURE_WEBAPP_NAME; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Azure CD is not set up yet. Missing:$missing. See docs/ci-cd.md."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve the commit being deployed
        id: rev
        # tag the image with the deployed commit, not the commit the workflow was started from
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ vars.AZURE_ACR_NAME }}"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.AZURE_ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.rev.outputs.sha }}

      # TODO before enabling: run `python manage.py migrate --noinput` against the production
      # database as a release step (e.g. a one-off container job) before switching traffic.

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ vars.AZURE_ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.rev.outputs.sha }}

# Ruff lint config for the Django project. Run from the repo root: `ruff check .`
# Deliberately small ruleset: real bugs and dead code, not style churn.
target-version = "py313"
line-length = 120
src = ["aria_project"]
extend-exclude = [
    "**/migrations/**",      # generated by makemigrations
    "advanceddb_project",    # course/database design artifacts, not the app
]

[lint]
select = [
    "E4", "E7", "E9",   # pycodestyle errors that matter (imports, statements, syntax)
    "F",                # pyflakes: undefined names, unused imports/variables
    "B",                # flake8-bugbear: likely bugs
    "DJ",               # flake8-django: Django-specific pitfalls
]
ignore = [
    "DJ001",   # null=True on CharField: existing schema decision, changing it needs a migration
    "DJ008",   # __str__ on every model: style, not a bug
    "B904",    # `raise ... from err`: style; the hits are in orders/payment error paths we don't churn for lint
]

[lint.per-file-ignores]
# tests may import star / define unused fixtures
"**/tests/**" = ["F401", "F811", "B011"]
"**/test_*.py" = ["F401", "F811", "B011"]
"**/tests.py" = ["F401", "F811", "B011"]

{% if products %}
    <div class="product-grid">
        {% for product in products %}
            <div class="product-card card">
                <h3>{{ product.name }}</h3>
                <p>{{ product.description }}</p>
                <p>Price: {{ product.unit_price }} {{ product.currency }}</p>
                <p>Stock: {{ product.stock_quantity }}</p>
            </div>
        {% endfor %}
    </div>
{% else %}
    <p>No products available.</p>
{% endif %}

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    {% block extra_css %}{% endblock %}
    <title>{% block title %}My Site{% endblock %}</title>
</head>
<body>
    {% block site_header %}
    <header class="border-bottom bg-body">
        <nav class="container navbar navbar-expand-sm py-3" aria-label="Dashboard navigation">
            <a class="navbar-brand fw-semibold" href="{% url 'core:home' %}">ARIA Home</a>
            <div class="navbar-nav ms-sm-auto">
                <a class="nav-link" href="{% url 'products:browse' %}">View store</a>
            </div>

            {% if username %}
                <div class="navbar-nav ms-sm-3">
                    {% comment %} <a class="nav-link" href="{% url 'accounts:account' %}">My Account</a> {% endcomment %}
                    <a class="nav-link" href="{% url 'accounts:logout' %}">Log Out</a>
                </div>
            {% else %}
                <div class="navbar-nav ms-sm-3">
                    <a class="nav-link" href="{% url 'accounts:login' %}">Log In</a>
                    <a class="nav-link" href="{% url 'accounts:register' %}">Register</a>
                </div>
            {% endif %}

        </nav>
    </header>
    {% endblock %}

    {% block content %}{% endblock %}
</body>
</html>
